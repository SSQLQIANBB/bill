services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    container_name: bill-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bill}
      MYSQL_USER: ${MYSQL_USER:-bill}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    volumes:
      - bill_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bill-redis
    restart: unless-stopped
    volumes:
      - bill_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: bill-api
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_NAME: Bill API
      DEBUG: "false"
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_RELOAD: "false"
      MYSQL_HOST: bill-mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bill}
      MYSQL_USER: ${MYSQL_USER:-bill}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_DAYS: ${ACCESS_TOKEN_EXPIRE_DAYS:-7}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      REDIS_URL: redis://bill-redis:6379/0
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      SMS_DEV_CODE: ${SMS_DEV_CODE:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mobile-web:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
      args:
        APP_ENV: production
        EXPO_PUBLIC_APP_ENV: production
        EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL:-http://122.51.31.139}
        EXPO_PUBLIC_AUTH_BASE_PATH: /api/v1/auth
        EXPO_PUBLIC_FINANCE_BASE_PATH: /api/v1/finance
    container_name: bill-mobile-web
    restart: unless-stopped
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    container_name: bill-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - mobile-web
      - api

volumes:
  bill_mysql_data:
  bill_redis_data:
