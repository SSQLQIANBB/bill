services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    container_name: ${MYSQL_CONTAINER_NAME:-bill-mysql}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-bill_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bill}
      MYSQL_USER: ${MYSQL_USER:-bill}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bill_password}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - bill_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  bill_mysql_data:
